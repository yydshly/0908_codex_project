<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1220" viewBox="0 0 1500 1220" role="img" aria-labelledby="title desc">
<title id="title">GeoLook 整体能力图：1 个 Skill，8 组执行能力</title>
<desc id="desc">仓库只有根目录 SKILL.md 定义的 geo 技能。AI 助手读取技能说明和参考资料，再调用 Python 程序；用户也可直接使用网页或命令行。执行能力归纳为品牌事实与问题库、网站抓取与体检、AI 答案采样、品牌与竞品分析、策略与执行任务、内容与资产生成、多渠道分发、验收与交付报告。数据保存在本地文件，需要外部网站、模型 API 或人工样本作为输入。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8ba378"/></marker><style>text{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif}.ink{fill:#263d30}.muted{fill:#62725c}.card{fill:#fff;stroke:#d8e2ce;stroke-width:1.5}.title{font-size:25px;font-weight:600}.body{font-size:18px}.code{font-family:Consolas,monospace;font-size:15px;fill:#607954}.line{stroke:#8ba378;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="1220" rx="24" fill="#f4f6ee"/>
<text x="52" y="47" font-size="13" letter-spacing="2.5" fill="#708462">OPEN SOURCE FIELD NOTES / 013 / GEOLOOK</text>
<text x="50" y="108" font-size="43" font-weight="650" class="ink">1 个 Skill，串起 8 组执行能力</text>
<text x="52" y="145" font-size="19" class="muted">技能负责指导 AI 怎么做；Python 程序负责执行。下面 8 组是研究归纳，不是 8 个独立技能。</text>
<rect x="1130" y="45" width="318" height="62" rx="12" fill="#e5edd8"/>
<text x="1150" y="71" font-size="15" fill="#4f6b3b">计数依据：整个仓库仅 1 份 SKILL.md</text><text x="1150" y="92" font-size="13" fill="#6b7e5a">固定研究版本：9492cb3 · 2026-08-10</text>

<rect x="52" y="183" width="760" height="159" rx="15" fill="#244f3c"/>
<text x="76" y="216" font-size="14" letter-spacing="1" fill="#c5daa9">入口 A / 让 AI 助手操作</text>
<text x="76" y="257" font-size="28" font-weight="600" fill="#fff">唯一技能：geo · GEO 全流程服务</text>
<text x="76" y="291" font-size="18" fill="#d9e7d0">SKILL.md：触发条件、工作步骤、工具用法与人工复核要求</text>
<text x="76" y="318" font-size="16" fill="#b9d0aa">references/ 提供判断方法与参考资料 → AI 助手按指南调用程序</text>
<rect x="836" y="183" width="296" height="159" rx="15" class="card"/>
<text x="859" y="216" font-size="14" fill="#789264">入口 B / 人直接操作</text>
<text x="859" y="257" class="title ink">网页工作台</text>
<text x="859" y="292" class="body muted">点击功能，查看数据与日志</text>
<text x="859" y="319" class="code">ui.html → dashboard.py</text>
<rect x="1156" y="183" width="292" height="159" rx="15" class="card"/>
<text x="1179" y="216" font-size="14" fill="#789264">入口 C / 直接运行</text>
<text x="1179" y="257" class="title ink">命令行</text>
<text x="1179" y="292" class="body muted">运行单步或完整流程</text>
<text x="1179" y="319" class="code">python3 scripts/geo.py …</text>
<path d="M430 343V375" class="line"/><path d="M984 343V375" class="line"/><path d="M1302 343V375" class="line"/>
<rect x="52" y="382" width="1396" height="73" rx="12" fill="#e5edd8" stroke="#c9d8b8"/>
<text x="76" y="413" font-size="22" font-weight="600" class="ink">执行与调度：geo.py 组织流程 · jobs.py 执行网页发起的后台任务</text>
<text x="76" y="440" font-size="17" class="muted">共用下面的业务程序；可以按需单独调用，也可以串成完整周期。使用网页或命令行时，无需先让 AI 读取 Skill。</text>
<text x="52" y="495" font-size="15" letter-spacing="1" fill="#708462">业务能力 / 01–04 收集资料与发现问题</text>

<g><rect x="52" y="515" width="331" height="185" rx="13" class="card"/>
<text x="74" y="551" class="title ink">01  品牌事实与问题库</text>
<text x="74" y="588" class="body muted">提取品牌信息，整理竞品候选</text><text x="74" y="618" class="body muted">生成、扩充用户可能问的问题</text>
<text x="74" y="658" class="code">bootstrap.py · expand.py</text><text x="74" y="681" font-size="14" fill="#8a692f">模型辅助生成，品牌事实需复核</text></g>
<g><rect x="407" y="515" width="331" height="185" rx="13" class="card"/>
<text x="429" y="551" class="title ink">02  网站抓取与体检</text>
<text x="429" y="588" class="body muted">检查页面能否访问、内容结构</text><text x="429" y="618" class="body muted">寻找定义、数字、对比等缺口</text>
<text x="429" y="658" class="code">crawl.py · audit.py</text><text x="429" y="681" font-size="14" fill="#8a692f">规则评分不等于被引用概率</text></g>
<g><rect x="762" y="515" width="331" height="185" rx="13" class="card"/>
<text x="784" y="551" class="title ink">03  AI 答案采样</text>
<text x="784" y="588" class="body muted">调用 API 或导入网页端答案</text><text x="784" y="618" class="body muted">保留原文、引用与采样环境</text>
<text x="784" y="658" class="code">sample.py · extension/</text><text x="784" y="681" font-size="14" fill="#8a692f">API 答案与网页搜索答案要区分</text></g>
<g><rect x="1117" y="515" width="331" height="185" rx="13" class="card"/>
<text x="1139" y="551" class="title ink">04  品牌与竞品分析</text>
<text x="1139" y="588" class="body muted">计算品牌提及、位次与引用</text><text x="1139" y="618" class="body muted">比较竞品、问题与渠道缺口</text>
<text x="1139" y="658" class="code">analytics.py · benchmark.py</text><text x="1139" y="681" font-size="14" fill="#8a692f">品牌匹配与负面判断可能误读</text></g>
<text x="52" y="742" font-size="15" letter-spacing="1" fill="#708462">业务能力 / 05–08 安排改进与复查交付</text>
<g><rect x="52" y="763" width="331" height="185" rx="13" class="card"/>
<text x="74" y="799" class="title ink">05  策略与执行任务</text>
<text x="74" y="836" class="body muted">制定内容和渠道建设计划</text><text x="74" y="866" class="body muted">分配优先级、负责人和验收条件</text>
<text x="74" y="906" class="code">blueprint.py · tasks.py</text><text x="74" y="929" font-size="14" fill="#8a692f">生成计划后仍需实际执行</text></g>
<g><rect x="407" y="763" width="331" height="185" rx="13" class="card"/>
<text x="429" y="799" class="title ink">06  内容与资产生成</text>
<text x="429" y="836" class="body muted">生成文章大纲、草稿和内容片段</text><text x="429" y="866" class="body muted">产出 llms.txt、JSON-LD 等资产</text>
<text x="429" y="906" class="code">generate.py</text><text x="429" y="929" font-size="14" fill="#8a692f">编造风险提示不能代替事实核验</text></g>
<g><rect x="762" y="763" width="331" height="185" rx="13" class="card"/>
<text x="784" y="799" class="title ink">07  多渠道分发</text>
<text x="784" y="836" class="body muted">GitHub、WordPress / 公众号草稿</text><text x="784" y="866" class="body muted">X、Reddit 与自定义 Webhook</text>
<text x="784" y="906" class="code">publish.py</text><text x="784" y="929" font-size="14" fill="#8a692f">需要渠道凭据，发布由人工触发</text></g>
<g><rect x="1117" y="763" width="331" height="185" rx="13" class="card"/>
<text x="1139" y="799" class="title ink">08  验收与交付报告</text>
<text x="1139" y="836" class="body muted">重抓验收、任务重开、前后对比</text><text x="1139" y="866" class="body muted">生成报告与客户交付包</text>
<text x="1139" y="906" class="code">verify.py · report.py · deliver.py</text><text x="1139" y="929" font-size="14" fill="#8a692f">效果变化不自动证明改动有效</text></g>

<rect x="52" y="978" width="1396" height="76" rx="12" fill="#e5edd8"/>
<text x="76" y="1009" font-size="21" font-weight="600" class="ink">共享数据层：work/&lt;项目名&gt;/ · 每个品牌独立保存本地文件</text>
<text x="76" y="1038" font-size="17" class="muted">品牌配置 / 事实卡 / 原始网页与答案 / 指标 / 任务 / 内容 / 报告　｜　复查结果回到下一轮观察，形成持续运营</text>
<text x="52" y="1098" font-size="18" class="ink">外部输入：品牌网站与材料、模型 API、人工或浏览器样本　　人工参与：核实事实、实施修改、确认发布</text>
<path d="M52 1123H1448" stroke="#d4dfc8"/>
<text x="52" y="1155" font-size="17" font-weight="600" class="ink">数量结论：1 个正式技能（geo）；8 组业务能力；3 种使用入口；一套本地执行程序。</text>
<text x="52" y="1186" font-size="14" class="muted">来源：aigclink/geolook · SKILL.md 与 scripts/、extension/ 源码｜原创研究示意图｜不是模型训练系统，也不保证品牌被推荐。</text>
</svg>
