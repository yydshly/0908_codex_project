<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc"><title id="title">Splat.js 整体架构引导图</title><desc id="desc">照片或视频经本机选帧、空间求解和高斯训练，输出可交互三维外观；应用扩展与额外算法研发分别标注。</desc><rect width="1600" height="1280" fill="#101b21"/>
<text x="64" y="38" fill="#e6efec" font-size="43" font-weight="700" font-family="Microsoft YaHei,Arial,sans-serif" dominant-baseline="text-before-edge">Splat.js：从拍摄到可交互三维</text>
<text x="66" y="101" fill="#b8cac6" font-size="23" font-weight="400" font-family="Microsoft YaHei,Arial,sans-serif" dominant-baseline="text-before-edge">读图顺序：输入真实素材 → 本机重建 → 保存与查看 → 扩展产品体验</text>
